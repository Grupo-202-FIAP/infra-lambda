name: Test and Deploy to AWS

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_TAG: latest

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Cache Terraform providers
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            infra/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/**/*.tf*') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Configure AWS credentials (OIDC + IAM Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format
        run: terraform fmt -check
        working-directory: infra

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Terraform Apply (Infra ECR)
        id: tf_apply
        run: |
          terraform apply -auto-approve
          echo "ECR_URI=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV
        working-directory: infra

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
          | docker login --username AWS --password-stdin ${{ env.ECR_URI }}

      - name: Build, Tag e Push Docker Image
        run: |
          docker build -t lambda-auth-local src/lambda_auth/
          docker tag lambda-auth-local:latest ${{ env.ECR_URI }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_URI }}:${{ env.IMAGE_TAG }}

      - name: Terraform Plan para Deploy
        run: terraform plan -out=tfplan
        working-directory: infra

      - name: Terraform Apply (Deploy Lambda)
        run: terraform apply -auto-approve tfplan
        working-directory: infra
