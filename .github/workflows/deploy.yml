name: Test and Deploy to AWS

on:
  push:
    branches:
      - dev

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: sa-east-1   # ajuste conforme sua região
      IMAGE_TAG: latest       # você pode usar github.sha para versionamento automático

    steps:
      # ------------------------------
      # 1️⃣ Checkout do repositório
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------
      # 2️⃣ Configurar credenciais AWS
      # ------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------
      # 3️⃣ Terraform – validação inicial
      # ------------------------------
      - name: Terraform Format
        run: terraform fmt -check
        working-directory: infra

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      # ------------------------------
      # 4️⃣ Terraform Apply – cria ECR e captura URI
      # ------------------------------
      - name: Terraform Apply (Infra ECR)
        id: tf_apply
        run: |
          terraform apply -auto-approve
          echo "ECR_URI=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV
        working-directory: infra

      # ------------------------------
      # 5️⃣ Docker – Build, Tag e Push
      # ------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
          | docker login --username AWS --password-stdin ${{ env.ECR_URI }}

      - name: Build, Tag e Push Docker Image
        run: |
          docker build -t lambda-auth-local src/lambda_auth/
          docker tag lambda-auth-local:latest ${{ env.ECR_URI }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_URI }}:${{ env.IMAGE_TAG }}

      # ------------------------------
      # 6️⃣ Terraform – Deploy Lambda
      # ------------------------------
      - name: Terraform Plan para Deploy
        run: terraform plan -out=tfplan
        working-directory: infra

      - name: Terraform Apply (Deploy Lambda)
        run: terraform apply -auto-approve tfplan
        working-directory: infra
